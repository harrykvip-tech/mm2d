<!DOCTYPE html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Ca.O</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>
body{margin:0;padding:14px;background:#f4efe6;color:#2a2118;font:15px/1.6 system-ui,"Noto Sans Myanmar","Myanmar Text",sans-serif}
main{max-width:520px;margin:auto}.card{background:#fffdf8;border:1px solid #e2d8c6;border-radius:14px;padding:12px;margin-bottom:12px}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:14px;margin:0 0 8px}label{font-size:12px;color:#7a6b5a;display:block;margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px;border:1px solid #e2d8c6;border-radius:10px;background:#f4efe6;color:#2a2118}
textarea{font:12px/1.4 ui-monospace,monospace}button{font:inherit;padding:9px 12px;border:1px solid #cfc3ad;background:#fffdf8;border-radius:10px;margin-top:8px;cursor:pointer}
button.go{background:#b3261e;color:#fff;border:0;font-weight:700;width:100%}.warn{color:#b3261e;font-size:13px}.m{font-size:13px;color:#7a6b5a}
</style></head><body><main>
<h1>Admin - Developer by Ca.O</h1>
<div class="card"><h2>၁။ Key ထုတ်ရန် (တစ်ကြိမ်ပဲ လုပ်ပါ)</h2>
<button id="gen">Key အသစ်ထုတ်မည်</button>
<label>Public key (config.js ထဲ LICENSE_PUBKEY: အစားထိုးထည့်ရန်)</label><textarea id="pub" rows="3" readonly></textarea>
<button id="cpub">Public key ကူးမည်</button>
<button id="dl">Private key ဖိုင် ဒေါင်းလုဒ်</button>
<p class="warn">Private key ဖိုင်ကို လုံခြုံစွာ သိမ်းပါ။ GitHub ပေါ်မတင်ပါနဲ့၊ တစ်ယောက်ယောက်ကို မပေးပါနဲ့။ ပျောက်ရင် လူတိုင်းအတွက် key အသစ်နဲ့ ပြန်လုပ်ရမယ်။</p></div>
<div class="card"><h2>၂။ Activation code ထုတ်ပေးရန်</h2>
<label>Private key (ဖိုင်ရွေးပါ၊ သို့ ဘေးက paste)</label><input type="file" id="pf" accept=".json,application/json"><textarea id="priv" rows="2" placeholder='{"kty":"EC",...}'></textarea>
<label>Customer ပို့တဲ့ Device ID</label><input id="did" placeholder="ABCDE-FGHJK" autocapitalize="characters">
<label>သက်တမ်း</label><select id="exp"><option value="7">၇ ရက်</option><option value="30" selected>၃၀ ရက်</option><option value="90">၉၀ ရက်</option><option value="365">၁ နှစ်</option><option value="0">သက်တမ်းမကုန် (အမြဲ)</option></select>
<button class="go" id="sign">Activation code ထုတ်မည်</button>
<label>Activation code (customer ကို ပို့ပါ)</label><textarea id="out" rows="4" readonly></textarea><button id="cout">ကုဒ်ကူးမည်</button>
<div class="m" id="msg"></div></div>
<script>
var $=function(i){return document.getElementById(i)},priv=null;
function b64u(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
/*SIGNFN*/
async function signCode(privJwk,id,exp){
  var key=await crypto.subtle.importKey('jwk',privJwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  var e='0';if(exp>0){var d=new Date();d.setDate(d.getDate()+exp);e=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  var payload=new TextEncoder().encode(id+'|'+e),sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,payload);
  return b64u(payload)+'.'+b64u(sig);
}
/*SIGNFNEND*/
$('gen').onclick=async function(){
  var kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  var pu=await crypto.subtle.exportKey('jwk',kp.publicKey),pr=await crypto.subtle.exportKey('jwk',kp.privateKey);
  $('pub').value=JSON.stringify({kty:pu.kty,crv:pu.crv,x:pu.x,y:pu.y,ext:true});
  priv=pr;$('priv').value=JSON.stringify(pr);$('msg').textContent='Key ထွက်ပြီ။ Private key ကို ဒေါင်းလုဒ်လုပ်ပြီး သိမ်းပါ။';
};
$('cpub').onclick=function(){$('pub').select();try{navigator.clipboard.writeText($('pub').value)}catch(e){document.execCommand('copy')}};
$('dl').onclick=function(){if(!$('priv').value)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('priv').value],{type:'application/json'}));a.download='ca-o-private-key.json';a.click()};
$('pf').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('priv').value=r.result};r.readAsText(f)};
$('sign').onclick=async function(){
  try{var pr=JSON.parse($('priv').value),id=$('did').value.trim().toUpperCase();
    if(!/^[A-Z2-9]{5}-[A-Z2-9]{5}$/.test(id)){$('msg').textContent='Device ID ပုံစံ မမှန်ပါ (ABCDE-FGHJK)';return}
    $('out').value=await signCode(pr,id,parseInt($('exp').value,10));$('msg').textContent='ပြီးပါပြီ။ ဒီကုဒ်က '+id+' စက်မှာပဲ သုံးလို့ရမယ်။';
  }catch(e){$('msg').textContent='အမှား: Private key မမှန်ပါ'}
};
$('cout').onclick=function(){$('out').select();try{navigator.clipboard.writeText($('out').value)}catch(e){document.execCommand('copy')}};
</script></main></body></html>
