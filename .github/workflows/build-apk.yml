name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Helper
        run: |
          cat > "$HOME/try.sh" <<'EOS'
          try() {
            label="$1"; shift
            "$@" > /tmp/out.log 2>&1 && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              msg=$( (grep -iE 'error|exception|failed|not found|wrong|cannot|could not' /tmp/out.log | head -6; echo ---; tail -n 6 /tmp/out.log) | tr '\n' ' ' | tr -d '\r' | cut -c1-1000 )
              echo "::error title=FAILED at ${label}::${msg}"
              cat /tmp/out.log
              exit "$rc"
            fi
            cat /tmp/out.log
          }
          EOS
      - name: Prepare web files
        run: |
          source "$HOME/try.sh"
          try "copy files" bash -c 'mkdir -p www && cp index.html config.js favicon.svg manifest.webmanifest icon-192.png icon-512.png www/ && ls -la www'
      - name: Add Android platform
        run: |
          source "$HOME/try.sh"
          try "npm install" npm install
          try "cap add android" npx cap add android
          try "camera permission" sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          try "cap sync" npx cap sync android
      - name: Make app icon
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install pillow
          /tmp/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          import os
          def logo(bg, scale, path):
              S = 1024
              im = Image.new('RGBA', (S, S), bg)
              d = ImageDraw.Draw(im)
              u = S / 100 * scale
              o = (S - 100 * u) / 2
              def R(x, y, w, h, r, c):
                  d.rounded_rectangle([o + x * u, o + y * u, o + (x + w) * u, o + (y + h) * u], radius=r * u, fill=c)
              R(24, 12, 52, 76, 7, '#2a2118')
              R(30, 18, 40, 18, 3, '#f4efe6')
              R(33, 22, 22, 3, 1, '#b3261e')
              for r in (43, 56, 69):
                  for c in (30, 44.5, 59):
                      if not (r == 69 and c == 59):
                          R(c, r, 11, 9, 2, '#7a6b5a')
              R(59, 69, 11, 9, 2, '#b3261e')
              im.save(path)
          os.makedirs('assets', exist_ok=True)
          logo('#f4efe6', 0.72, 'assets/icon-only.png')
          logo((0, 0, 0, 0), 0.55, 'assets/icon-foreground.png')
          PY
          npx @capacitor/assets generate --android --iconBackgroundColor '#f4efe6' --iconBackgroundColorDark '#f4efe6' || echo "icon generation skipped"
      - name: Build debug APK
        run: |
          source "$HOME/try.sh"
          cd android
          chmod +x gradlew
          try "gradle assembleDebug" ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sarein-2d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
