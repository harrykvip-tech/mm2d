<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2D စာရင်း</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#b3261e"><script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>')</script>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2a2118;--mute:#7a6b5a;--line:#e2d8c6;--acc:#b3261e;--ok:#1f7a45;--hi:#fde7c3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#221b14;--ink:#f3e9d8;--mute:#a89a85;--line:#3a2f23;--acc:#ff6b5e;--ok:#5fd28a;--hi:#4a3514}}
:root[data-theme="dark"]{--bg:#17120d;--card:#221b14;--ink:#f3e9d8;--mute:#a89a85;--line:#3a2f23;--acc:#ff6b5e;--ok:#5fd28a;--hi:#4a3514}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Noto Sans Myanmar","Myanmar Text",sans-serif;padding:12px}
main{max-width:520px;margin:auto}
h1{font-size:19px;margin:2px 0 10px}h2{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--acc);color:#fff;border:0;font-weight:700;width:100%;margin-top:8px;padding:11px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea,input{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical}
.names{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.nm{white-space:nowrap;flex:0 0 auto}.nm.plus{border-style:dashed;color:var(--mute)}
.msg{font-size:13px;margin-top:6px;min-height:18px;color:var(--mute)}.msg.err{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.c{border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0;line-height:1.15;font-variant-numeric:tabular-nums;background:var(--bg)}
.c b{display:block;font-size:12px}.c i{display:block;font-style:normal;font-size:9.5px;color:var(--mute);min-height:11px}
.c.has{border-color:var(--ink)}.c.has i{color:var(--ink);font-weight:600}
.c.win{background:var(--hi);border-color:var(--acc)}.c.win b{color:var(--acc)}
.c.top{position:relative;box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}.c.top::after{content:"★";position:absolute;top:-7px;right:-4px;font-size:11px;color:var(--acc);background:var(--card);border-radius:50%;line-height:1}
.chip.top{border-color:var(--acc);color:var(--acc);font-weight:700}
.toptag{font-size:13px;color:var(--acc);margin:-2px 0 8px;min-height:19px}.topnum{color:var(--acc);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums}.chip b{color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border:0}.row span:first-child{color:var(--mute)}.row span:last-child{font-weight:700;text-align:right}
.row.big span:last-child{font-size:20px}.pos{color:var(--ok)}.neg{color:var(--acc)}
.two{display:flex;gap:8px}.two>*{flex:1}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.ent{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ent:last-child{border:0}.ent .raw{flex:1;word-break:break-word;white-space:pre-wrap;max-height:4.8em;overflow:hidden}
.ent small{color:var(--mute);display:block;font-variant-numeric:tabular-nums}
.ent button{padding:2px 9px;font-size:16px;line-height:1.2}
.link{background:none;border:1px solid var(--line);color:var(--mute);font-size:13px}.link.arm{border-color:var(--acc);color:var(--acc)}
.quick{display:flex;gap:6px;margin-top:10px;align-items:center}.quick input{min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:8px}
th,td{padding:5px 3px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}th:first-child,td:first-child{text-align:left}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:10px}label.chk input{width:auto;margin-top:4px}th{color:var(--mute);font-weight:500;font-size:11px}.tw{overflow-x:auto}
main{position:relative}.dev{position:absolute;top:-6px;right:0;font-size:11px;color:var(--mute);letter-spacing:.02em}
</style>
</head>
<body>
<main>
<div class="dev">Developer by - Ca.O</div>
<h1><svg width="30" height="30" viewBox="0 0 100 100" style="vertical-align:middle;margin-right:8px" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#f4efe6" stroke="#d9cbb5" stroke-width="3"/><rect x="24" y="12" width="52" height="76" rx="7" fill="#2a2118"/><rect x="30" y="18" width="40" height="18" rx="3" fill="#f4efe6"/><g fill="#7a6b5a"><rect x="30" y="43" width="11" height="9" rx="2"/><rect x="44.5" y="43" width="11" height="9" rx="2"/><rect x="59" y="43" width="11" height="9" rx="2"/><rect x="30" y="56" width="11" height="9" rx="2"/><rect x="44.5" y="56" width="11" height="9" rx="2"/><rect x="59" y="56" width="11" height="9" rx="2"/><rect x="30" y="69" width="11" height="9" rx="2"/><rect x="44.5" y="69" width="11" height="9" rx="2"/></g><rect x="59" y="69" width="11" height="9" rx="2" fill="#b3261e"/></svg>2D စာရင်း</h1>
<div class="seg" role="group" aria-label="အချိန်ရွေး">
  <button id="s1" aria-pressed="true">12:01</button><button id="s2" aria-pressed="false">4:30</button>
</div>
<div class="seg" id="daybar"><button id="dprev" aria-label="မနေ့">◀</button><input type="date" id="day" aria-label="ရက်စွဲ" style="flex:3;min-width:0;text-align:center"><button id="dnext" aria-label="နက်ဖြန်">▶</button><button id="dtoday">ယနေ့</button></div>
<div class="msg" id="daynote" style="margin:-4px 0 8px;color:var(--acc);font-weight:600"></div>
<div class="names" id="names"></div>
<div class="card" id="newc" hidden>
  <label for="nn">ဖောက်သည်နာမည် အသစ်</label>
  <div class="two"><input id="nn" placeholder="ကျော်ကျော်"><button class="go" id="nsave" style="margin:0;flex:0 0 90px">သိမ်းမည်</button></div>
</div>

<div class="card" id="inpcard" hidden>
  <h2>ဂဏန်းထည့်ရန်</h2>
  <textarea id="inp" rows="4" placeholder="customer ပို့တဲ့စာကို တစ်ခုလုံး paste လုပ်ပါ (စာကြောင်းရှည်လည်း ရ၊ တစ်ကြောင်းချင်းလည်း ရ)&#10;26 500 45R1000 07 r 2000&#10;12 300"></textarea>
  <button class="go" id="add">ထည့်မည်</button>
  <details style="margin-top:8px"><summary style="font-size:13px;color:var(--mute);cursor:pointer">အထူးစာလုံးများ ကြည့်ရန်</summary><div id="help" class="msg" style="line-height:1.8"></div></details>
  <button class="link" id="skip" hidden style="margin-top:6px;width:100%">နားမလည်တာကို ကျော်ပြီး ကျန်တာ ထည့်မည်</button>
  <div class="quick">
    <input id="qn" inputmode="numeric" maxlength="2" placeholder="ဂဏန်း" aria-label="ဂဏန်း">
    <button id="qr" aria-pressed="false" title="ပြောင်းပြန်ပါ">R</button>
    <input id="qa" inputmode="numeric" placeholder="ငွေ" aria-label="ငွေ">
    <button id="qb" style="flex:0 0 auto">+</button>
  </div>
  <div class="msg" id="msg">အမြန်ထည့်ရန် အောက်ကတန်း: ဂဏန်း၊ ငွေ ရေးပြီး Enter။ R ပါရင် 45 နဲ့ 54 နှစ်ခုလုံး ထိုငွေအတူ ပါမယ်။</div>
</div>

<div class="card" id="detail"></div>

<div class="card">
  <h2 id="gt">ဂဏန်း ၀၀ မှ ၉၉</h2>
  <div class="toptag" id="toptag"></div>
  <div class="grid" id="grid"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="card">
  <h2>ထွက်ဂဏန်း တွက်ရန်</h2>
  <div class="two">
    <div><label for="win">ထွက်ဂဏန်း</label><input id="win" inputmode="numeric" maxlength="2" placeholder="26"></div>
    <div><label for="pct">နုတ် (%)</label><input id="pct" inputmode="decimal"></div>
    <div><label for="mul">ဆပေး (×)</label><input id="mul" inputmode="decimal"></div>
  </div>
  <label class="chk"><input type="checkbox" id="dup"> ၁ အပါ/ပတ် စသည်မှာ 11 (အပူး) ကို နှစ်ကြိမ်ထည့်ရန် (စုစုပေါင်း ၂၀ ခု)</label>
  <div id="res" style="margin-top:8px"></div>
</div>
<details class="card" id="histcard"><summary style="cursor:pointer;font-weight:600">နေ့စဉ် မှတ်တမ်း (ရက်အလိုက်)</summary><div id="histlist" class="tw" style="margin-top:8px"></div></details>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var sess='1',D,pending='',armed=null,qR=false;
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var day=ymd(new Date());
function key(){return 'ledger2d_d_'+day+'_'+sess}
function allKeys(){var o=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),m=/^ledger2d_d_(\d{4}-\d{2}-\d{2})_([12])$/.exec(k);if(m)o.push({k:k,d:m[1],s:m[2]})}}catch(e){}return o}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var x=parseFloat(String(v).replace(/,/g,''));return isNaN(x)?0:x}
function pad(n){return (n<10?'0':'')+n}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})}
function money(n){return (n<0?'−':'')+fmt(Math.abs(n))}
function compact(n){if(!n)return '';if(n>=1e6)return +(n/1e6).toFixed(2)+'M';if(n>=1e3)return +(n/1e3).toFixed(n>=1e4?1:2)+'k';return String(n)}
var BD='၀၁၂၃၄၅၆၇၈၉';
function norm(s){return s.replace(/[၀-၉]/g,function(c){return BD.indexOf(c)})}
function load(){var s=null,mig=false;try{s=JSON.parse(localStorage.getItem(key()))}catch(e){}
  if(!s){
    try{if(day===ymd(new Date())&&!localStorage.getItem('ledger_mig_'+sess)){var old=JSON.parse(localStorage.getItem('ledger2d_v2_'+sess));localStorage.setItem('ledger_mig_'+sess,'1');if(old&&old.custs){s=old;mig=true}}}catch(e){}
    if(!s){var pv=allKeys().filter(function(x){return x.s===sess&&x.d<day}).sort(function(a,b){return a.d<b.d?1:-1})[0];
      if(pv){try{var p=JSON.parse(localStorage.getItem(pv.k));s={custs:(p.custs||[]).map(function(c){return {id:c.id,name:c.name,pct:c.pct||'',mul:c.mul||'',entries:[]}}),pct:p.pct,mul:p.mul,dup:p.dup,win:'',sel:'all'}}catch(e){}}}
  }
  D=s||{};D.custs=D.custs||[];D.pct=D.pct==null?'15':D.pct;D.mul=D.mul==null?'85':D.mul;D.win=D.win||'';D.sel=D.sel||'all';D.dup=D.dup==null?true:D.dup;
  if(D.sel!=='all'&&!D.custs.some(function(c){return c.id===D.sel}))D.sel='all';
  if(mig)save()}
function save(){try{localStorage.setItem(key(),JSON.stringify(D))}catch(e){}try{renderHistory()}catch(e){}}
function sumL(L){var tw=0,net=0,has=false,w=(L.win||'').length===2?parseInt(L.win,10):-1;
  (L.custs||[]).forEach(function(c){var T=tot(c.entries||[]),p=(c.pct!==''&&c.pct!=null)?num(c.pct):num(L.pct==null?15:L.pct),m=(c.mul!==''&&c.mul!=null)?num(c.mul):num(L.mul==null?85:L.mul);
    tw+=T.sum;if(w>=0){net+=T.sum-T.sum*p/100-T.t[w]*m;has=true}});return {sum:tw,net:net,has:has,w:w}}
function renderHistory(){
  var days={};allKeys().forEach(function(x){try{var r=sumL(JSON.parse(localStorage.getItem(x.k)));if(r.sum>0)(days[x.d]=days[x.d]||{})[x.s]=r}catch(e){}});
  var ds=Object.keys(days).sort().reverse(),h='<table><thead><tr><th>ရက်စွဲ</th><th>12:01</th><th>4:30</th></tr></thead><tbody>';
  ds.forEach(function(d){h+='<tr><td><b>'+d+'</b></td>'+['1','2'].map(function(k){var r=days[d][k];
    return '<td data-act="goday" data-d="'+d+'" data-s="'+k+'" style="cursor:pointer">'+(r?fmt(r.sum)+(r.has?'<br><small class="'+(r.net>=0?'pos':'neg')+'">'+(r.net>=0?'+':'')+money(r.net)+' ('+pad(r.w)+')</small>':''):'-')+'</td>'}).join('')+'</tr>'});
  $('histlist').innerHTML=ds.length?h+'</tbody></table><div class="msg">ကွက်ကိုနှိပ်ရင် အဲဒီနေ့စာရင်း ပွင့်မယ်။ အစိမ်း/အနီက ထွက်ဂဏန်းထည့်ထားမှ အမြတ်/အရှုံး ပြတာ။</div>':'<div class="msg">မှတ်တမ်းမရှိသေးပါ</div>'}
function cur(){for(var i=0;i<D.custs.length;i++)if(D.custs[i].id===D.sel)return D.custs[i];return null}
function say(m,err){$('msg').textContent=m;$('msg').className='msg'+(err?' err':'')}

// စာကြောင်းရှည် / တစ်ကြောင်းချင်း နှစ်မျိုးလုံး ဒီ parser တစ်ခုတည်းနဲ့ ရတယ်
var GR={'နက္ခ':'18 24 35 69 70 81 42 53 96 07','ပါဝါ':'05 16 27 38 49 50 61 72 83 94','အပူး':'00 11 22 33 44 55 66 77 88 99','ညီကို':'01 12 23 34 45 56 67 78 89 90'};
function sp(x){return x.split(' ')}
function rev(x){return x[1]+x[0]}
function withDigit(k){var o=[],i,t;for(i=0;i<100;i++){t=pad(i);if(+t[0]===k||+t[1]===k)o.push(t)}if(!D||D.dup)o.push(''+k+k);return o}
function digs(t){var o=[];String(t).split('').forEach(function(ch){if(o.indexOf(ch)<0)o.push(ch)});return o}
function topN(k){var o=[],i;for(i=0;i<10;i++)o.push(''+k+i);return o}
function endN(k){var o=[],i;for(i=0;i<10;i++)o.push(''+i+k);return o}
var TEN='10 20 30 40 50 60 70 80 90 00';
function brk(k){var o=[],i,t;for(i=0;i<100;i++){t=pad(i);if((+t[0]+ +t[1])%10===k)o.push(t)}return o}
var AMT='(\\d{1,3}(?:,\\d{3})+|\\d+)',SC='[\\s=\\-*\\/\\\\:,.;|_()~]',SEP=SC+'*',DS='[\\s.\\-,\\/_|]*',LS='(?:\\s*[.\\-,\\/_|]+\\s*|\\s+)';
var RE_SRC='(နက္ခတ်|နက္ခ|ပါဝါ|အပူး|ညီကို)'+SEP+'([rR])?'+SEP+AMT+'\\s*([rR])?'+
  '|(\\d{1,10})'+DS+'(အပါ|ပတ်|ပါ)'+SEP+AMT+
  '|(\\d{1,10})'+DS+'(ဘရိတ်|ဘရိတ|bk)'+SEP+AMT+
  '|(\\d{1,2}(?!\\d)(?:'+LS+'\\d{1,2}(?!\\d))*)'+SEP+'([rR])?'+SEP+AMT+'\\s*([rR])?'+
  '|(\\d{2,10})'+DS+'(ခွေပူး|ခွေ)'+SEP+AMT+
  '|(ခွေပူး|ခွေ)'+SEP+'(\\d{2,10})'+SEP+AMT+
  '|(\\d{1,10})'+DS+'(ထိပ်|ပိတ်)'+SEP+AMT+
  '|(ဆယ်ပြည့်|ဆယ်ဖြစ်)'+SEP+AMT+
  '|(ထိပ်|ပိတ်)'+SEP+'(\\d{1,10})'+SEP+AMT;
function toA(x){return parseInt(String(x).replace(/,/g,''),10)}
// ဂဏန်းမြန်မာ/အင်္ဂလိပ်၊ - . / , space အကုန်ရအောင် ဖတ်ရလွယ်အောင် အရင်ညှိ
function norm2(t){return norm(String(t)).replace(/[–—−‑‒]/g,'-').replace(/[၊။]/g,' ').replace(/(\d)\s*[xX×✕]\s*(\d)/g,'$1 $2').replace(/ကျပ်|ဖိုး|\bks\b/gi,' ')}
// စာကြောင်းတစ်ကြောင်းချင်း ခွဲဖတ် (တစ်ကြောင်းမှားလည်း အခြားကြောင်းတွေ မထိ)
function parseLine(txt){
  txt=norm2(txt);
  var re=new RegExp(RE_SRC,'gi'),items=[],bad=[],last=0,m,a,list,g;
  function gap(t){t=t.replace(/[\s,.;:|၊။\-()（）\[\]\/\\_~=*]+/g,'');if(t)bad.push(t)}
  function add(l,a,g){l.forEach(function(x){items.push({n:parseInt(x,10),a:a,r:false,g:g})})}
  while((m=re.exec(txt))){
    gap(txt.slice(last,m.index));last=re.lastIndex;
    if(m[1]){
      a=toA(m[3]);if(!a){bad.push(m[0]);continue}
      var k1=m[1]==='နက္ခတ်'?'နက္ခ':m[1];
      list=sp(GR[k1]);g=k1;
      if(k1==='ညီကို'&&(m[2]||m[4])){list=list.concat(list.map(rev));g+=' R'}
      add(list,a,g);
    }else if(m[5]){a=toA(m[7]);if(!a){bad.push(m[0]);continue}var o5=[];digs(m[5]).forEach(function(ch){o5=o5.concat(withDigit(+ch))});add(o5,a,m[5]+' '+m[6])}
    else if(m[8]){a=toA(m[10]);if(!a){bad.push(m[0]);continue}var o8=[];digs(m[8]).forEach(function(ch){o8=o8.concat(brk(+ch))});add(o8,a,m[8]+' '+m[9])}
    else if(m[11]){a=toA(m[13]);if(!a){bad.push(m[0]);continue}
      (m[11].match(/\d{1,2}/g)||[]).forEach(function(x){items.push({n:parseInt(x,10),a:a,r:!!(m[12]||m[14])})})}

function panel(mode,s){
  if(ov){ov.remove();ov=null}
  var id=devId(),locked=mode==='locked',lg=document.querySelector('h1 svg'),
  LG=lg?lg.outerHTML.replace('width="30" height="30"','width="64" height="64"').replace('margin-right:8px','margin:0'):'',
  stat='',title=locked?(s.trialUsed?'အစမ်းသုံးခွင့် ကုန်ဆုံးပါပြီ':'အသုံးပြုခွင့် လိုအပ်ပါသည်'):'Menu',
  note=locked?(s.trialUsed?'ဤ Device ID သည် အစမ်းသုံးခွင့် ('+TRIAL+' ရက်) အသုံးပြုပြီးသား ဖြစ်နေပါသည်။ ဆက်လက်အသုံးပြုလိုပါက Key သက်တမ်း ဝယ်ယူပါ။':'အောက်က Device ID ကို Developer (Ca.O) ထံ ပို့ပြီး Activation key တောင်းပါ။'):'';
  if(!locked){stat=s.state==='active'?'<div style="padding:10px;border-radius:10px;background:#e3f4e8;color:#1f6b3a;margin-bottom:10px">✅ အသုံးပြုခွင့်ရှိသည်'+(s.name?' · '+esc(s.name):'')+'<br>သက်တမ်း: <b>'+esc(fmtD(s.exp))+'</b></div>':'<div style="padding:10px;border-radius:10px;background:#fff3d6;color:#7a5200;margin-bottom:10px">🕒 အစမ်းသုံးနေသည် · ကျန် <b>'+Math.ceil(s.left/864e5)+' ရက်</b></div>'}
  var tgl=TG+(TG.indexOf('?')<0?'?':'&')+'text='+encodeURIComponent('Key သက်တမ်း ဝယ်/တိုးလိုပါသည်။ Device ID: '+id);
  ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:auto;padding:22px 16px;font:15px/1.6 system-ui,"Noto Sans Myanmar","Myanmar Text",sans-serif;color:var(--ink)';
  ov.innerHTML='<div style="max-width:420px;margin:0 auto"><div style="text-align:right;font-size:11px;color:var(--mute)">Developer by - Ca.O</div>'+
   '<div style="text-align:center;margin-top:6px">'+LG+'</div>'+
   '<h1 style="font-size:20px;margin:12px 0 6px;text-align:center">'+title+'</h1>'+
   (note?'<p style="color:var(--mute);margin:0 0 12px;text-align:center">'+note+'</p>':'')+stat+
   '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center"><div style="font-size:12px;color:var(--mute)">Device ID</div>'+
   '<div style="font:700 26px/1.4 ui-monospace,monospace;letter-spacing:.06em;user-select:all">'+id+'</div>'+
   '<button id="lic-copy" style="margin-top:6px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)">Copy</button></div>'+
   '<a id="lic-tg" href="'+tgl+'" target="_blank" rel="noopener" style="display:block;margin-top:12px;padding:13px;border-radius:10px;background:#229ed9;color:#fff;font-weight:700;text-align:center;text-decoration:none">'+(locked?'Key ဝယ်ယူရန်':'Key သက်တမ်းတိုးရန်')+' · Telegram '+esc(TGN)+'</a>'+
   '<label for="lic-in" style="display:block;margin:16px 0 4px;font-size:13px;color:var(--mute)">Activation key ရှိပြီးသားဆိုရင် ဒီမှာထည့်ပါ</label>'+
   '<textarea id="lic-in" rows="3" style="width:100%;font:13px/1.4 ui-monospace,monospace;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)"></textarea>'+
   '<button id="lic-go" style="width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:15px">Key ဖွင့်မည်</button>'+
   '<div id="lic-msg" style="min-height:22px;margin-top:8px;color:var(--acc);font-size:14px">'+esc(s.why||'')+'</div>'+
   (locked?'':'<button id="lic-close" style="width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)">ပိတ်မည်</button>')+'</div>';
  document.body.appendChild(ov);
  ov.querySelector('#lic-copy').onclick=function(){try{navigator.clipboard.writeText(id);this.textContent='Copied ✓'}catch(e){this.textContent='ဖိနှိပ်ကူးပါ'}};
  ov.querySelector('#lic-go').onclick=async function(){var code=ov.querySelector('#lic-in').value,r=await check(code,devId(),effNow());
    if(r.ok){set('app_license',code.trim());ov.remove();ov=null;await refresh()}else ov.querySelector('#lic-msg').textContent=r.m};
  var cl=ov.querySelector('#lic-close');if(cl)cl.onclick=function(){ov.remove();ov=null};
}
async function refresh(){cur=await status();setBtn(cur);if(cur.state==='locked'&&!(ov&&ov.dataset.l))panel('locked',cur);return cur}
function addBtn(){var m=document.querySelector('main');if(!m||btn)return;btn=document.createElement('button');
  btn.id='menubtn';btn.style.cssText='position:absolute;top:14px;right:0;padding:4px 10px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer';
  btn.onclick=async function(){var s=await status();cur=s;panel(s.state==='locked'?'locked':'menu',s)};m.appendChild(btn)}
(async function(){addBtn();await refresh();
  setInterval(async function(){var s=await status();cur=s;setBtn(s);if(s.state==='locked'&&!ov)panel('locked',s)},60000)})();
})();
</script>
</body>
</html>
